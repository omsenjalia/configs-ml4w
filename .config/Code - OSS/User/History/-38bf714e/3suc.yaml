services:
# Libre Office
  libreoffice:
    image: lscr.io/linuxserver/libreoffice:latest
    networks:
      - default    
    container_name: libreoffice
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ~/docker-compose/libre/config:/config
    ports:
      - 3000:3000
      - 3001:3001
    restart: unless-stopped
# Homepage
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    networks:
      - default
    container_name: homepage
    environment:
      PUID: 1000 # optional, your user id
      PGID: 1000 # optional, your group id
    ports:
      - 8080:3000
    volumes:
      - ~/docker-compose/homepage/config:/app/config # Make sure your local config directory exists
      - /var/run/docker.sock:/var/run/docker.sock:ro # optional, for docker integrations
    restart: unless-stopped
# Obsidian
  obsidian:
    image: lscr.io/linuxserver/obsidian:latest
    networks:
      - default
    container_name: obsidian
    security_opt:
      - seccomp:unconfined #optional
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
    volumes:
      - ~/docker-compose/obsidian/config:/config
    ports:
      - 3002:3000
      - 3005:3001
    shm_size: "1gb"
    restart: unless-stopped
# Nginx Proxy Manager
#  nginx:
#    image: 'jc21/nginx-proxy-manager:latest'
#    networks:
#      - default
#    restart: unless-stopped
#    ports:
#      # These ports are in format <host-port>:<container-port>
